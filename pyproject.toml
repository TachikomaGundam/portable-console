[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "portable-console"
version = "0.2.0"
description = "Portable root-free server console: hardware-metrics daemon + data-driven web portal + config-driven control cards (stdlib only)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["console", "monitoring", "systemd", "ipmi", "nvidia", "portal"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: No Input/Output (Daemon)",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: System :: Monitoring",
]
# zero third-party runtime dependencies — DESIGN.md §0 hard constraint

[project.scripts]
portable-console = "portable_console.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
portable_console = [
  "web/*",
  "systemd/*.service",
  "console.config.example.json",
]
